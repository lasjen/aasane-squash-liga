services:
  db:
    image: postgres:17-alpine
    container_name: aasane-squash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-squashliga}
      POSTGRES_USER: ${POSTGRES_USER:-squash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squash}
      TZ: Europe/Oslo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
